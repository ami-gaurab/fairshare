name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install NPM Dependencies
        run: npm ci || npm install

      - name: 6. Add and Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 7. Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 8. Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FairShare-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
